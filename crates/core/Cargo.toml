[package]
name = "stepwise-core"
description = "The core of Stepwise: its language (lexer, parser, checker, step-by-step interpreter), the world of the robot and the levels."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The level files, in TOML (see docs/technical-choices.md, Levels): only the parser and serde,
# without the writer.
serde.workspace = true
toml = { version = "1.2.0", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
