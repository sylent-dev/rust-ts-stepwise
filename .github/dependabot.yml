version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The packages of the interface, their updates of the week in one pull request.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is refused by SvelteKit (6), by svelte-check (5 and 6) and by
      # typescript-eslint (under 6.1): to remove once `npm install -D typescript@7` passes in
      # web/ (see the backlog).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types of Node.js stay those of the oldest Node.js the project runs on (`engines` in
      # web/package.json): raised by hand, with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
